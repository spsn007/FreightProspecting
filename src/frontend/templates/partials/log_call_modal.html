<!-- Stage 3C Outreach CRM — Log Call Modal Component -->
<script>
function logCallModalComponent() {
  return {
    open: false,
    saving: false,
    copied: false,
    companyId: null,
    companyName: '',
    facilities: [],
    selectedFacilityId: '',
    contactName: '',
    phoneNumber: '',
    disposition: 'NO_ANSWER',
    feedbackNotes: '',
    followUpDate: '',
    followUpTime: '09:00',
    originStateProv: '',
    destStateProv: '',
    errorMessage: '',
    successMessage: '',
    isSuppressed: false,
    suppressionMessage: '',
    showLaneWarning: false,
    laneWarningMessage: '',
    previousActiveElement: null,

    init() {
      window.addEventListener('open-log-call', (e) => {
        const d = e.detail || {};
        this.companyId = d.companyId || (d.company ? d.company.company_id : null);
        this.companyName = d.companyName || (d.company ? (d.company.operating_brand || d.company.company_name) : 'Prospect Company');
        this.facilities = d.childFacilities || (d.company && d.company.facilities ? d.company.facilities.map(f => ({
          id: f.facility_id || f.id,
          name: f.facility_name || f.name,
          city: f.city,
          state: f.state_prov || f.state,
          phone: f.phone || (f.best_contact ? f.best_contact.phone_number : ''),
          contact: f.contact || (f.best_contact ? f.best_contact.contact_name : '')
        })) : []);
        this.selectedFacilityId = d.facilityId !== undefined && d.facilityId !== null ? String(d.facilityId) : (this.facilities.length === 1 ? String(this.facilities[0].id) : '');
        this.contactName = d.contactName || (d.facility && d.facility.best_contact ? d.facility.best_contact.contact_name : '');
        this.phoneNumber = d.phoneNumber || (this.facilities.length === 1 ? (this.facilities[0].phone || '') : '');
        this.originStateProv = d.originStateProv || (this.facilities.length === 1 ? (this.facilities[0].state || '') : '');
        this.destStateProv = d.destStateProv || '';
        this.disposition = d.defaultDisposition || 'NO_ANSWER';
        this.feedbackNotes = '';
        this.followUpDate = '';
        this.followUpTime = '09:00';
        this.errorMessage = '';
        this.successMessage = '';
        this.isSuppressed = d.isSuppressed || false;
        this.suppressionMessage = d.suppressionMessage || '';
        this.showLaneWarning = false;
        this.laneWarningMessage = '';
        this.saving = false;
        this.previousActiveElement = document.activeElement;
        this.open = true;
        this.checkLaneSuppression();
        this.$nextTick(() => {
          const target = document.getElementById('call-facility-select') || document.getElementById('call-contact-name');
          if (target) target.focus();
        });
      });
    },

    async checkLaneSuppression() {
      if (!this.originStateProv && !this.destStateProv) {
        this.showLaneWarning = false;
        this.laneWarningMessage = '';
        return;
      }
      try {
        const params = new URLSearchParams();
        if (this.companyId) params.append('company_id', this.companyId);
        if (this.selectedFacilityId) params.append('facility_id', this.selectedFacilityId);
        if (this.originStateProv) params.append('origin', this.originStateProv.trim().toUpperCase());
        if (this.destStateProv) params.append('destination', this.destStateProv.trim().toUpperCase());

        const res = await fetch(`/api/suppressions/check?${params.toString()}`);
        if (res.ok) {
          const data = await res.json();
          if (data.is_suppressed) {
            this.showLaneWarning = true;
            this.laneWarningMessage = data.message || `Active lane restriction in effect (${data.scope || 'LANE'}).`;
          } else {
            this.showLaneWarning = false;
            this.laneWarningMessage = '';
          }
        }
      } catch (e) {
        // silent fail
      }
    },

    closeModal() {
      if (this.saving) return;
      this.open = false;
      if (this.previousActiveElement && typeof this.previousActiveElement.focus === 'function') {
        this.previousActiveElement.focus();
      }
    },

    handleKeyDown(e) {
      if (e.key === 'Escape' && !this.saving) {
        this.closeModal();
      } else if (e.key === 'Tab') {
        const modalEl = document.getElementById('log-call-modal-content');
        if (!modalEl) return;
        const focusable = Array.from(modalEl.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el.classList.contains('sr-only'));
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    },

    onFacilityChange() {
      if (!this.selectedFacilityId) {
        this.checkLaneSuppression();
        return;
      }
      const fac = this.facilities.find(f => String(f.id) === String(this.selectedFacilityId));
      if (fac) {
        if (fac.phone) this.phoneNumber = fac.phone;
        if (fac.contact) this.contactName = fac.contact;
        if (fac.state) this.originStateProv = fac.state;
      }
      this.checkLaneSuppression();
    },

    copyNumber() {
      if (!this.phoneNumber) return;
      navigator.clipboard.writeText(this.phoneNumber);
      this.copied = true;
      setTimeout(() => { this.copied = false; }, 2000);
    },

    setQuickFollowUp(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      this.followUpDate = d.toISOString().split('T')[0];
    },

    async submitCall() {
      if (!this.companyId) {
        this.errorMessage = 'Company ID missing';
        return;
      }
      if (this.isSuppressed) {
        this.errorMessage = this.suppressionMessage || 'Outreach blocked: active suppression / Do Not Contact in effect.';
        return;
      }
      this.saving = true;
      this.errorMessage = '';
      this.successMessage = '';

      let followUpIso = null;
      if (this.followUpDate) {
        const timePart = this.followUpTime || '09:00';
        try {
          const localDt = new Date(`${this.followUpDate}T${timePart}:00`);
          if (!isNaN(localDt.getTime())) {
            followUpIso = localDt.toISOString();
          }
        } catch (e) {}
      }

      const payload = {
        company_id: parseInt(this.companyId),
        facility_id: this.selectedFacilityId ? parseInt(this.selectedFacilityId) : null,
        disposition: this.disposition,
        feedback_notes: this.feedbackNotes ? this.feedbackNotes.trim() : null,
        follow_up_date: this.followUpDate || null,
        follow_up_time: this.followUpTime || null,
        follow_up_at: followUpIso,
        user_timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null,
        channel: 'PHONE',
        origin_state_prov: this.originStateProv ? this.originStateProv.trim().toUpperCase() : null,
        dest_state_prov: this.destStateProv ? this.destStateProv.trim().toUpperCase() : null,
      };

      try {
        const res = await fetch('/api/outreach', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 403) {
            this.isSuppressed = true;
            this.suppressionMessage = data.detail || 'Outreach blocked by active suppression / DNC.';
          }
          throw new Error(data.detail || 'Failed to save call');
        }

        this.successMessage = 'Call logged successfully!';
        window.dispatchEvent(new CustomEvent('outreach-logged', { detail: data.data }));

        setTimeout(() => {
          this.closeModal();
          if (window.location.pathname.startsWith('/crm/')) {
            window.location.reload();
          }
        }, 700);
      } catch (err) {
        this.errorMessage = err.message || 'Error saving call log';
      } finally {
        this.saving = false;
      }
    }
  };
}
</script>

<div x-data="logCallModalComponent()"
     id="log-call-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="call-modal-title"
     x-show="open"
     x-cloak
     style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px);"
     @keydown="handleKeyDown($event)">

  <!-- Modal Box -->
  <div id="log-call-modal-content" class="card"
    @click.stop
    style="width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); color: var(--color-text-main); padding: 1.5rem;">
    
    <!-- Modal Header -->
    <div style="display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--color-border); padding-bottom: 0.85rem; margin-bottom: 1.25rem;">
      <div>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(59, 130, 246, 0.15); color: var(--color-primary);">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 16px; height: 16px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
          </span>
          <h3 id="call-modal-title" class="modal-title" style="margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--color-text-main);">Log Broker Outreach Call</h3>
        </div>
        <div style="font-size: 0.85rem; color: var(--color-text-muted); margin-top: 0.25rem; font-weight: 500;" x-text="companyName"></div>
      </div>
      <button type="button" @click="closeModal" :disabled="saving" aria-label="Close dialog" class="modal-close-btn btn btn-secondary btn-sm" style="padding: 0.2rem 0.5rem; line-height: 1;">&times;</button>
    </div>

    <!-- DNC / Active Suppression Warning Banner -->
    <div x-show="isSuppressed" style="background: rgba(239, 68, 68, 0.18); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.4); padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 0.5rem;">
      <span style="font-size: 1.1rem; line-height: 1;">🚫</span>
      <div>
        <div style="font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;">DNC / Active Suppression Block</div>
        <div style="font-weight: 400; font-size: 0.8125rem; margin-top: 0.15rem;" x-text="suppressionMessage || 'Outreach to this company or facility is blocked by an active suppression policy.'"></div>
      </div>
    </div>

    <!-- Alert / Messages -->
    <div x-show="errorMessage" style="background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.6rem 0.85rem; border-radius: var(--radius-sm); font-size: 0.8125rem; margin-bottom: 1rem;" x-text="errorMessage"></div>
    <div x-show="successMessage" style="background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.6rem 0.85rem; border-radius: var(--radius-sm); font-size: 0.8125rem; margin-bottom: 1rem;" x-text="successMessage"></div>

    <form @submit.prevent="submitCall">
      <!-- Facility Contacted Dropdown -->
      <div style="margin-bottom: 1rem;">
        <label for="call-facility-select" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.35rem;">
          Facility Context
        </label>
        <select id="call-facility-select" x-model="selectedFacilityId" @change="onFacilityChange" class="filter-select" style="width: 100%; font-size: 0.875rem; padding: 0.45rem 0.65rem;">
          <option value="">Corporate / General Switchboard (Company-Level)</option>
          <template x-for="f in facilities" :key="f.id">
            <option :value="f.id" x-text="f.name + ' (' + (f.city || '') + ', ' + (f.state || '') + ')'"></option>
          </template>
        </select>
        <div style="font-size: 0.72rem; color: var(--color-text-muted); margin-top: 0.25rem;">
          Distinguishes company-level corporate calls from specific plant dock/shipping desk outreach.
        </div>
      </div>

      <!-- Lane Context (Evaluates Lane-Specific Suppressions) -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
        <div>
          <label for="call-origin-state" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.35rem;">
            Origin State/Prov (Optional)
          </label>
          <input type="text" id="call-origin-state" x-model="originStateProv" @input.debounce.300ms="checkLaneSuppression" @change="checkLaneSuppression" maxlength="2" placeholder="e.g. GA" class="search-input" style="width: 100%; font-size: 0.875rem; padding: 0.45rem 0.65rem; text-transform: uppercase;">
        </div>
        <div>
          <label for="call-dest-state" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.35rem;">
            Destination State/Prov (Optional)
          </label>
          <input type="text" id="call-dest-state" x-model="destStateProv" @input.debounce.300ms="checkLaneSuppression" @change="checkLaneSuppression" maxlength="2" placeholder="e.g. FL" class="search-input" style="width: 100%; font-size: 0.875rem; padding: 0.45rem 0.65rem; text-transform: uppercase;">
        </div>
      </div>

      <!-- Lane Restriction / Suppression Warning Banner -->
      <div x-show="showLaneWarning" style="background: rgba(245, 158, 11, 0.18); color: #b45309; border: 1px solid rgba(245, 158, 11, 0.4); padding: 0.6rem 0.85rem; border-radius: var(--radius-sm); font-size: 0.8125rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 0.5rem;">
        <span style="font-size: 1rem; line-height: 1;">⚠️</span>
        <div>
          <div style="font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;">Active Lane Restriction / Customer Rule</div>
          <div style="font-weight: 400; font-size: 0.775rem; margin-top: 0.15rem;" x-text="laneWarningMessage"></div>
        </div>
      </div>

      <!-- Phone Number & One-Click Actions -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
        <div>
          <label for="call-contact-name" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.35rem;">
            Contact Person / Desk
          </label>
          <input type="text" id="call-contact-name" x-model="contactName" placeholder="e.g. Shipping / Traffic Manager" class="search-input" style="width: 100%; font-size: 0.875rem; padding: 0.45rem 0.65rem;">
        </div>
        <div>
          <label for="call-phone-number" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.35rem;">
            Phone Number
          </label>
          <div style="display: flex; gap: 0.4rem; align-items: center;">
            <input type="text" id="call-phone-number" x-model="phoneNumber" placeholder="e.g. (555) 123-4567" class="search-input" style="flex: 1; font-size: 0.875rem; padding: 0.45rem 0.65rem;">
            <button type="button" @click="copyNumber" class="btn btn-secondary btn-sm" title="Copy Number" style="padding: 0.45rem 0.6rem; font-size: 0.75rem; white-space: nowrap;">
              <span x-text="copied ? 'Copied!' : 'Copy'"></span>
            </button>
            <template x-if="phoneNumber">
              <a :href="'tel:' + phoneNumber.replace(/[^0-9+]/g, '')" class="btn btn-primary btn-sm" title="Direct Dial" style="padding: 0.45rem 0.6rem; font-size: 0.75rem; text-decoration: none; display: inline-flex; align-items: center;">
                Call
              </a>
            </template>
          </div>
        </div>
      </div>

      <!-- Call Disposition / Outcome Pills (All 8 Canonical Dispositions) -->
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.45rem;">
          Call Outcome / Disposition <span style="color:#ef4444;">*</span>
        </label>
        
        <!-- Connected / Progress Dispositions -->
        <div style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.35rem;">
          Live Conversations & Progress
        </div>
        <div role="radiogroup" aria-label="Live Conversations & Progress" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 0.65rem;">
          <!-- INTERESTED -->
          <label class="disposition-pill" :class="disposition === 'INTERESTED' ? 'selected-interested' : ''">
            <input type="radio" name="disposition" value="INTERESTED" x-model="disposition" class="sr-only">
            <span>Interested</span>
            <span style="font-size: 0.6875rem; font-weight: 400; opacity: 0.85;">Quote/packet</span>
          </label>

          <!-- CONNECTED_DECISION_MAKER -->
          <label class="disposition-pill" :class="disposition === 'CONNECTED_DECISION_MAKER' ? 'selected-connected-dm' : ''">
            <input type="radio" name="disposition" value="CONNECTED_DECISION_MAKER" x-model="disposition" class="sr-only">
            <span>Connected (DM)</span>
            <span style="font-size: 0.6875rem; font-weight: 400; opacity: 0.85;">Shipping desk</span>
          </label>

          <!-- CONNECTED_GATEKEEPER -->
          <label class="disposition-pill" :class="disposition === 'CONNECTED_GATEKEEPER' ? 'selected-connected-gatekeeper' : ''">
            <input type="radio" name="disposition" value="CONNECTED_GATEKEEPER" x-model="disposition" class="sr-only">
            <span>Gatekeeper</span>
            <span style="font-size: 0.6875rem; font-weight: 400; opacity: 0.85;">Switchboard</span>
          </label>

          <!-- CALL_BACK -->
          <label class="disposition-pill" :class="disposition === 'CALL_BACK' ? 'selected-callback' : ''">
            <input type="radio" name="disposition" value="CALL_BACK" x-model="disposition" class="sr-only">
            <span>Call Back</span>
            <span style="font-size: 0.6875rem; font-weight: 400; opacity: 0.85;">Agreed time</span>
          </label>
        </div>

        <!-- Attempts / Unconnected Dispositions -->
        <div style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.35rem;">
          Unconnected & Other Outcomes
        </div>
        <div role="radiogroup" aria-label="Unconnected & Other Outcomes" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem;">
          <!-- LEFT_VOICEMAIL -->
          <label class="disposition-pill" :class="disposition === 'LEFT_VOICEMAIL' ? 'selected-left-voicemail' : ''">
            <input type="radio" name="disposition" value="LEFT_VOICEMAIL" x-model="disposition" class="sr-only">
            <span>Left Voicemail</span>
            <span style="font-size: 0.6875rem; font-weight: 400; opacity: 0.85;">Desk VM</span>
          </label>

          <!-- NO_ANSWER -->
          <label class="disposition-pill" :class="disposition === 'NO_ANSWER' ? 'selected-no-answer' : ''">
            <input type="radio" name="disposition" value="NO_ANSWER" x-model="disposition" class="sr-only">
            <span>No Answer</span>
            <span style="font-size: 0.6875rem; font-weight: 400; opacity: 0.85;">Ring / busy</span>
          </label>

          <!-- NOT_INTERESTED -->
          <label class="disposition-pill" :class="disposition === 'NOT_INTERESTED' ? 'selected-not-interested' : ''">
            <input type="radio" name="disposition" value="NOT_INTERESTED" x-model="disposition" class="sr-only">
            <span>Not Interested</span>
            <span style="font-size: 0.6875rem; font-weight: 400; opacity: 0.85;">Not DNC</span>
          </label>

          <!-- WRONG_CONTACT -->
          <label class="disposition-pill" :class="disposition === 'WRONG_CONTACT' ? 'selected-wrong-contact' : ''">
            <input type="radio" name="disposition" value="WRONG_CONTACT" x-model="disposition" class="sr-only">
            <span>Wrong Contact</span>
            <span style="font-size: 0.6875rem; font-weight: 400; opacity: 0.85;">Outdated info</span>
          </label>
        </div>
      </div>

      <!-- Feedback / Conversation Notes -->
      <div style="margin-bottom: 1rem;">
        <label for="call-feedback-notes" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.35rem;">
          Feedback & Call Notes
        </label>
        <textarea id="call-feedback-notes" x-model="feedbackNotes" rows="3" placeholder="e.g. Shipping manager returns Monday. Or: Asked for flatbed packet for GA->NC lumber lane..." class="search-input" style="width: 100%; font-size: 0.875rem; padding: 0.5rem 0.65rem; resize: vertical; height: auto;"></textarea>
      </div>

      <!-- Follow-Up Scheduling -->
      <div style="background: var(--color-border-subtle); border: 1px dashed var(--color-border); border-radius: var(--radius-md); padding: 0.75rem; margin-bottom: 1.25rem;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem;">
          <label style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); margin: 0;">
            Schedule Next Follow-Up (Optional)
          </label>
          <div style="display: flex; gap: 0.35rem;">
            <button type="button" @click="setQuickFollowUp(1)" class="btn btn-secondary btn-sm" style="font-size: 0.7rem; padding: 0.15rem 0.45rem;">Tomorrow</button>
            <button type="button" @click="setQuickFollowUp(3)" class="btn btn-secondary btn-sm" style="font-size: 0.7rem; padding: 0.15rem 0.45rem;">+3 Days</button>
            <button type="button" @click="setQuickFollowUp(7)" class="btn btn-secondary btn-sm" style="font-size: 0.7rem; padding: 0.15rem 0.45rem;">Next Week</button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;">
          <div>
            <input type="date" id="call-follow-up-date" aria-label="Follow-up date" x-model="followUpDate" class="filter-select" style="width: 100%; font-size: 0.8125rem; padding: 0.35rem 0.5rem;">
          </div>
          <div>
            <input type="time" id="call-follow-up-time" aria-label="Follow-up time" x-model="followUpTime" class="filter-select" style="width: 100%; font-size: 0.8125rem; padding: 0.35rem 0.5rem;">
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; border-top: 1px solid var(--color-border); padding-top: 1rem;">
        <button type="button" @click="closeModal" :disabled="saving" class="btn btn-secondary" style="font-size: 0.875rem;">
          Cancel
        </button>
        <button type="submit" :disabled="saving || isSuppressed" class="btn btn-primary" style="font-size: 0.875rem; display: inline-flex; align-items: center; gap: 0.4rem;">
          <span x-show="saving" style="display: inline-block; width: 12px; height: 12px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></span>
          <span x-text="saving ? 'Recording...' : (isSuppressed ? 'Outreach Blocked' : 'Save Call Record')"></span>
        </button>
      </div>
    </form>
  </div>
</div>
