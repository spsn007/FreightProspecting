<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login — FreightProspecting</title><link rel="stylesheet" href="/static/css/app.css"><link rel="stylesheet" href="/static/css/team.css?v=20261002-team-final2"></head>
<body class="team-login"><main class="team-login-card">
  <div class="brand-icon">FP</div><h1>Welcome to FreightProspecting</h1><p>Sign in to work with your team.</p>
  {% if error %}<p class="team-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Profile name<input class="form-input" name="username" value="{{ username|default('') }}" autocomplete="username" maxlength="50" required autofocus></label>
    <label>Password<input class="form-input" type="password" name="password" autocomplete="current-password" maxlength="128" required></label>
    <button class="btn btn-primary" type="submit">Sign In</button>
  </form>
</main></body></html>
